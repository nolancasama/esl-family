<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Family — ESL Speaking Activity</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Loading screen (shown while DiceBear images fetch) -->
<div id="loading-screen">
  <div id="loading-title">よみこみちゅう…</div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     PHASE 0 — INTRO (mysterious isekai-style text opening)
═══════════════════════════════════════════════════════════════════ -->
<div id="phase-intro" class="phase">
  <button id="intro-skip-btn">スキップ</button>
  <div id="intro-tap-zone">
    <div id="intro-line"></div>
    <div id="intro-hint">タップ</div>
    <button id="intro-yes-btn" class="btn btn-primary btn-lg intro-control" style="display:none;">はい</button>
    <div id="intro-input-wrap" class="intro-control" style="display:none;">
      <input id="intro-name-input" type="text" maxlength="20" placeholder="なまえ" autocomplete="off">
      <button id="intro-next-btn" class="btn btn-primary btn-lg">つぎへ</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     PHASE 1 — CHOOSE YOUR FAMILY
═══════════════════════════════════════════════════════════════════ -->
<div id="phase-choose" class="phase rpg-scene">
  <div class="rpg-header-panel">
    <h1 id="choose-header">This is my grandfather.</h1>
    <p id="choose-subtitle" class="rpg-subtitle">新しいおじいさんに会いましょう。</p>
  </div>
  <div class="page-body">
    <div id="choose-progress" class="choose-progress">
      <span class="progress-seg"></span>
      <span class="progress-seg"></span>
      <span class="progress-seg"></span>
      <span class="progress-seg"></span>
      <span class="progress-seg"></span>
      <span class="progress-seg"></span>
    </div>
    <div id="char-grid" class="char-grid"></div>
    <div class="choose-actions">
      <button id="reroll-btn" class="btn btn-ghost btn-sm" aria-label="ほかの人に会う" title="ほかの人に会う">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>ほかの人に会う</span>
      </button>
    </div>
    <div id="family-lineup"></div>
  </div>

  <!-- Character profile card (slides in over the gallery on portrait click) -->
  <div id="profile-overlay">
    <div id="profile-card">
      <div id="profile-left">
        <img id="profile-portrait" src="" alt="">
      </div>
      <div id="profile-right">
        <div id="profile-section">
          <div id="profile-fields"></div>
        </div>
        <div id="profile-actions">
          <button id="profile-back-btn" class="btn btn-ghost btn-lg">もどる</button>
          <button id="profile-choose-btn" class="btn btn-primary btn-lg">この人にする</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     PHASE 2 — ASSIGN ROLES BY SPEAKING
═══════════════════════════════════════════════════════════════════ -->
<div id="phase-assign" class="phase">
  <div id="assign-layout">

    <!-- Picture area: character fills the screen, overlaid controls -->
    <div id="assign-picture-area">

      <!-- Top overlay: prompt -->
      <div id="assign-prompt">
        <div id="assign-instruction">えいごで言ってみよう！</div>
        <div id="assign-sentence"></div>
      </div>

      <!-- Character image -->
      <img id="assign-char-img" src="" alt="character">

      <!-- Feedback + transcript overlaid above mic -->
      <div id="feedback-msg" class="feedback-msg"></div>
      <div id="transcript-box"></div>

      <!-- Bottom-left overlay: undo -->
      <button id="undo-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14L4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
        </svg>
        もどす
      </button>

      <!-- Bottom-center overlay: mic label + mic -->
      <div id="mic-label">タップして はなそう</div>
      <button id="mic-btn" aria-label="タップして はなそう">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm7 9a1 1 0 0 1 1 1 8 8 0 0 1-7 7.94V21h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.06A8 8 0 0 1 4 11a1 1 0 0 1 2 0 6 6 0 0 0 12 0 1 1 0 0 1 1-1z"/>
        </svg>
      </button>

    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     PHASE 3 — SELFIE
═══════════════════════════════════════════════════════════════════ -->
<div id="phase-selfie" class="phase rpg-scene">
  <div class="rpg-header-panel">
    <h1 class="icon-heading">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      かぞくしゃしんの じかん！
    </h1>
    <p class="rpg-subtitle">かぞくしゃしんの ために じどりを とろう！</p>
  </div>
  <div id="selfie-wrap">
    <video id="selfie-video" autoplay playsinline muted></video>
    <img id="selfie-preview" src="" alt="Your selfie" style="display:none;">
    <div id="selfie-feedback" style="display:none;background:#FEE2E2;color:#991B1B;border-radius:12px;padding:12px 16px;font-weight:700;font-size:.95rem;text-align:center;max-width:400px;width:100%;"></div>
    <div id="selfie-actions">
      <button id="retake-btn" class="btn btn-ghost" disabled>とりなおす</button>
      <button id="snap-btn" class="btn btn-success" aria-label="しゃしんを とる" title="しゃしんを とる" disabled>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button id="selfie-next-btn" class="btn btn-primary btn-lg" disabled>つぎへ →</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     PHASE 4 — AUTO-PRESENTATION
═══════════════════════════════════════════════════════════════════ -->
<div id="phase-presentation" class="phase rpg-scene">
  <div class="rpg-header-panel">
    <h1>My family</h1>
  </div>
  <div id="pres-wrap">
    <div id="pres-char-frame">
      <img id="pres-char-img" src="" alt="family member" width="240" height="336">
    </div>
    <div id="pres-progress"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     PHASE 5 — FAMILY PHOTO
═══════════════════════════════════════════════════════════════════ -->
<div id="phase-photo" class="phase">
  <div id="photo-wrap">
    <canvas id="family-photo-canvas"></canvas>
    <div id="photo-actions">
      <button id="download-btn" class="btn btn-success">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>しゃしんを ほぞん</span>
      </button>
      <button id="play-again-btn" class="btn btn-primary">もういちど あそぶ！</button>
    </div>
  </div>
</div>

<!-- Camera flash overlay -->
<div id="flash-overlay"></div>

<!-- Scene transition (fade to white, then fade back in) -->
<div id="scene-fade"></div>

<!-- Scripts — load order matters (dependencies first) -->
<script src="js/characters.js"></script>
<script src="js/speech.js"></script>
<script src="js/recorder.js"></script>
<script src="js/selfie.js"></script>
<script src="js/presentation.js"></script>
<script src="js/photo.js"></script>
<script src="js/intro.js"></script>
<script src="js/profile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
